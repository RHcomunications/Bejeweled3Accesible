name: Build Android APK

on:
  push:
    branches:
      - android
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Cache Android NDK
      id: cache-ndk
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/android-ndk-r27c
        key: ndk-r27c-linux

    - name: Cache libopenmpt build
      id: cache-libopenmpt
      uses: actions/cache@v4
      with:
        path: libs
        key: libopenmpt-0.8.9-android

    - name: Build libopenmpt for Android (NDK)
      if: steps.cache-libopenmpt.outputs.cache-hit != 'true'
      run: |
        if [ ! -d "${{ runner.tool_cache }}/android-ndk-r27c" ]; then
          curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q ndk.zip -d "${{ runner.tool_cache }}"
        fi
        export ANDROID_NDK_HOME="${{ runner.tool_cache }}/android-ndk-r27c"
        export PATH=$PATH:$ANDROID_NDK_HOME
        curl -L -o libopenmpt.tar.gz https://lib.openmpt.org/files/libopenmpt/src/libopenmpt-0.8.9+release.makefile.tar.gz
        mkdir -p jni
        tar -xzf libopenmpt.tar.gz -C jni --strip-components=1
        cp jni/build/android_ndk/Android.mk jni/Android.mk
        ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk APP_ABI="arm64-v8a x86_64" APP_STL=c++_static APP_PLATFORM=android-21 MPT_WITH_MINIMP3=1 MPT_WITH_STBVORBIS=1

    - name: Copy libopenmpt.so into csproj libs
      run: |
        mkdir -p src/Android/libs/arm64-v8a src/Android/libs/x86_64
        cp libs/arm64-v8a/libopenmpt.so src/Android/libs/arm64-v8a/
        cp libs/x86_64/libopenmpt.so src/Android/libs/x86_64/

    - name: Restore Workloads
      run: dotnet workload restore src/Android/Bejeweled3.Android.csproj

    - name: Setup Signing Keystore
      run: |
        if [ ! -f .github/release.keystore ]; then
          keytool -genkeypair -v \
            -keystore .github/release.keystore \
            -alias bejeweled3key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass bejeweled3secret \
            -keypass bejeweled3secret \
            -dname "CN=RHCommunications, OU=Gaming, O=RHCommunications, L=City, S=State, C=US"
        fi

    - name: Build and Sign Android APK
      run: |
        dotnet build src/Android/Bejeweled3.Android.csproj -c Release -t:PackageForAndroid \
          -p:AndroidKeyStore=true \
          -p:AndroidSigningKeyStore=../../.github/release.keystore \
          -p:AndroidSigningStorePass=bejeweled3secret \
          -p:AndroidSigningKeyAlias=bejeweled3key \
          -p:AndroidSigningKeyPass=bejeweled3secret

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Bejeweled3Accessible-Android-APK
        path: src/Android/bin/Release/net9.0-android/*-Signed.apk
